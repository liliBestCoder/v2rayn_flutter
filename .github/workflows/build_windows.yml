name: Build Windows

on:
  push:
    branches: [ master, main, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ master, main, 'fix/**', 'feature/**' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test test/unit/client_config_test.dart test/unit/line_node_test.dart test/unit/uwp_loopback_test.dart test/cdp/ test/mutation/

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build\windows\x64\runner\Release\

