name: Build macOS

on:
  push:
    branches: [ master, main, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ master, main, 'fix/**', 'feature/**' ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44'
          channel: 'stable'

      - name: Select correct luxwap_core binary
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            cp macos/Runner/Resources/bin/luxwap_core/arm64/luxwap_core macos/Runner/Resources/bin/luxwap_core/luxwap_core
          else
            cp macos/Runner/Resources/bin/luxwap_core/amd64/luxwap_core macos/Runner/Resources/bin/luxwap_core/luxwap_core
          fi
          chmod +x macos/Runner/Resources/bin/luxwap_core/luxwap_core

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test test/unit/client_config_test.dart test/unit/line_node_test.dart test/unit/uwp_loopback_test.dart test/cdp/ test/mutation/

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/

